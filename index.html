<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Cyprian Kipchumba</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .payment-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #198754;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #198754;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="payment-box">

    <h1>Pay Cyprian Kipchumba</h1>

    <p class="subtitle">
      Secure M-PESA payment
    </p>

    <form id="paymentForm">

      <label for="phone">M-PESA Phone Number</label>

      <input
        type="tel"
        id="phone"
        placeholder="07XXXXXXXX"
        required
      >

      <label for="amount">Amount (KES)</label>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        required
      >

      <button type="submit" id="payButton">
        Pay with M-PESA
      </button>

    </form>

    <div id="message"></div>

    <p class="note">
      An M-PESA STK Push will be sent to your phone.
    </p>

  </div>

<script>
const form = document.getElementById("paymentForm");
const button = document.getElementById("payButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value;

  if (!/^07\d{8}$/.test(phone) && !/^2547\d{8}$/.test(phone)) {
    message.textContent = "Enter a valid Kenyan phone number.";
    return;
  }

  if (!amount || Number(amount) < 1) {
    message.textContent = "Enter a valid amount.";
    return;
  }

  button.disabled = true;
  button.textContent = "Sending STK Push...";
  message.textContent = "";

  try {

    const response = await fetch("/api/stkpush", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: phone,
        amount: Number(amount)
      })
    });

    const data = await response.json();

    if (data.success) {

      message.textContent =
        "STK Push sent. Check your phone and enter your M-PESA PIN.";

    } else {

      message.textContent =
        data.message || "Unable to send STK Push.";

    }

  } catch (error) {

    message.textContent =
      "Payment service is currently unavailable.";

  }

  button.disabled = false;
  button.textContent = "Pay with M-PESA";

});
</script>

</body>
  </html>
